name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Read verified DSH versions
    runs-on: ubuntu-latest
    outputs:
      dsh: ${{ steps.matrix.outputs.dsh }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Derive the compatibility matrix
        id: matrix
        run: node scripts/compat-matrix.mjs >> "$GITHUB_OUTPUT"

  test:
    name: Full suite (baseline DSH)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check src tests scripts .github package.json

      - name: Build, type-check, and run the full suite
        run: pnpm test

  compatibility:
    name: Compatibility (DSH ${{ matrix.dsh }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.versions.outputs.dsh) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shipped bundle
        run: pnpm build

      - name: Type-check and test the selected DSH runtime
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: node scripts/test-compat.mjs "$DSH_VERSION"
