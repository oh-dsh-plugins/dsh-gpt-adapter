name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Read verified DSH versions
    runs-on: ubuntu-latest
    outputs:
      dsh: ${{ steps.matrix.outputs.dsh }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Derive the compatibility matrix
        id: matrix
        run: node scripts/compat-matrix.mjs >> "$GITHUB_OUTPUT"

  test:
    name: Full suite (baseline DSH)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check src tests scripts .github package.json

      - name: Build, type-check, and run the full suite
        run: pnpm test

      - name: Pack the candidate once
        run: |
          mkdir -p .generated/candidate
          npm pack --ignore-scripts --pack-destination .generated/candidate
          cd .generated/candidate
          sha256sum ./*.tgz > SHA256SUMS

      - name: Upload the candidate
        uses: actions/upload-artifact@v4
        with:
          name: dsh-gpt-adapter-candidate
          path: |
            .generated/candidate/*.tgz
            .generated/candidate/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error

  compatibility:
    name: Compatibility (DSH ${{ matrix.dsh.version }})
    needs: [versions, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.versions.outputs.dsh) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.dsh.node }}
          cache: pnpm

      - name: Install fixture source dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the candidate
        uses: actions/download-artifact@v4
        with:
          name: dsh-gpt-adapter-candidate
          path: .generated/candidate

      - name: Verify the candidate checksum
        working-directory: .generated/candidate
        run: sha256sum --check SHA256SUMS

      - name: Install Chromium for the browser checks
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Verify the official DSH CLI and model settings
        env:
          DSH_VERSION: ${{ matrix.dsh.version }}
        run: node scripts/test-host-compat.mjs "$DSH_VERSION" .generated/candidate/*.tgz

      - name: Type-check and exercise the candidate with the selected runtime
        env:
          DSH_VERSION: ${{ matrix.dsh.version }}
        run: node scripts/test-compat.mjs --archive .generated/candidate/*.tgz "$DSH_VERSION"
